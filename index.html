<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Scheduler</title>
<style>
:root{
  --bg:#0d1117; --bg2:#151b23; --card:#1a222c; --card2:#212b36;
  --line:#2b3644; --line2:#3a4757;
  --tx:#e6edf3; --tx2:#9aa8b8; --tx3:#6b7a8c;
  --upper:#7c8cff; --core:#f5a524; --lower:#2dd4a7; --cardio:#ff6b81; --rest:#5a6875;
  --ok:#2dd4a7; --warn:#f5a524; --bad:#ff6b81;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:40px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;background:rgba(13,17,23,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.logo{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--upper),var(--lower));
  display:grid;place-items:center;font-weight:800;font-size:15px;color:#0d1117;
}
.hd h1{font-size:17px}
.hd .sub{font-size:12px;color:var(--tx3);margin-top:1px}
.hd .spacer{flex:1}
.iconbtn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--tx2);background:var(--card);
}
.iconbtn:hover{border-color:var(--line2);color:var(--tx)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;
  color:var(--tx2);white-space:nowrap;border:1px solid transparent;
}
nav button:hover{color:var(--tx);background:var(--card)}
nav button.on{background:var(--tx);color:var(--bg);}

/* ---------- generic ---------- */
.page{display:none;padding-top:18px;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.pad0{padding:0;overflow:hidden}
.sechd{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sechd h2{font-size:15px}
.sechd .line{flex:1;height:1px;background:var(--line)}
.muted{color:var(--tx2)}
.tiny{font-size:12px;color:var(--tx3)}
.row{display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

.btn{
  padding:10px 16px;border-radius:11px;font-weight:600;font-size:14px;
  background:var(--card2);border:1px solid var(--line2);color:var(--tx);
}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.pri:hover{opacity:.88}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#4a2b33}
.btn.danger:hover{background:#2b1a1f}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip{
  padding:9px 14px;border-radius:10px;border:1px solid var(--line2);
  background:var(--bg2);font-size:14px;font-weight:600;color:var(--tx2);
  min-width:52px;text-align:center;transition:.12s;
}
.chip:hover{border-color:var(--tx3);color:var(--tx)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.c-upper{color:var(--upper)} .bg-upper{background:var(--upper)}
.c-core{color:var(--core)}   .bg-core{background:var(--core)}
.c-lower{color:var(--lower)} .bg-lower{background:var(--lower)}
.c-cardio{color:var(--cardio)} .bg-cardio{background:var(--cardio)}
.c-rest{color:var(--rest)}   .bg-rest{background:var(--rest)}
.t-upper{background:rgba(124,140,255,.14);color:var(--upper)}
.t-core{background:rgba(245,165,36,.14);color:var(--core)}
.t-lower{background:rgba(45,212,167,.14);color:var(--lower)}
.t-cardio{background:rgba(255,107,129,.14);color:var(--cardio)}
.t-rest{background:rgba(90,104,117,.18);color:#8b97a5}

/* ---------- today ---------- */
.hero{
  border-radius:var(--r);padding:20px;margin-bottom:14px;position:relative;overflow:hidden;
  border:1px solid var(--line);background:var(--card);
}
.hero:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent,var(--upper))}
.hero .date{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.hero .title{font-size:27px;font-weight:750;margin:6px 0 2px;letter-spacing:-.02em}
.hero .why{font-size:13px;color:var(--tx2)}
.statebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.state{padding:5px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--tx2)}

.ex{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--bg2)}
.ex.done{border-color:rgba(45,212,167,.35);background:rgba(45,212,167,.05)}
.ex h4{font-size:15px}
.ex .presc{font-size:12.5px;color:var(--tx3);margin-top:2px}
.ex .lbl{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
.repblock{margin:8px 0 2px 10px;padding:2px 0 6px 14px;border-left:2px solid var(--exc,var(--upper))}
.repblock .lbl{color:var(--exc,var(--upper));opacity:.9;margin:10px 0 6px}
.repblock .lbl:first-child{margin-top:2px}
.chip.rep{border-color:color-mix(in srgb, var(--exc,var(--upper)) 45%, var(--line2))}
.chip.rep.on{background:var(--exc,var(--upper));border-color:var(--exc,var(--upper));color:#0d1117}
.chip.rep:hover{border-color:var(--exc,var(--upper))}
.figbtn{margin-left:auto;font-size:12px;color:var(--tx3);border:1px solid var(--line);padding:4px 9px;border-radius:8px}
.figbtn:hover{color:var(--tx);border-color:var(--line2)}

.intens{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.intens button{padding:13px 8px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);text-align:center}
.intens button b{display:block;font-size:14px}
.intens button span{font-size:11px;color:var(--tx3)}
.intens button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.intens button.on span{color:rgba(13,17,23,.65)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;color:var(--tx3);padding:4px 0}
.day{
  border:1px solid var(--line);border-radius:9px;min-height:74px;padding:6px;
  background:var(--bg2);text-align:left;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:3px;
}
.day:hover{border-color:var(--line2)}
.day.blank{background:transparent;border-color:transparent;cursor:default}
.day.today{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx)}
.day.past{opacity:.72}
.day .n{font-size:11.5px;font-weight:700;color:var(--tx2)}
.day .g{font-size:11px;font-weight:700;line-height:1.25}
.day .xs{font-size:9.5px;color:var(--tx3);line-height:1.3;overflow:hidden}
.day .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.day .mk{position:absolute;right:5px;top:5px;font-size:10px}
.day{cursor:pointer}
.skipbtn{
  position:absolute;right:4px;bottom:4px;width:21px;height:21px;border-radius:6px;
  border:1px solid var(--line2);background:var(--card);color:var(--tx3);font-size:11px;
  display:grid;place-items:center;line-height:1;opacity:.55;
}
.skipbtn:hover{opacity:1;color:var(--bad);border-color:var(--bad)}
.skipbtn.undo:hover{color:var(--ok);border-color:var(--ok)}
.ex.off{opacity:.5}
.ex.off h4{text-decoration:line-through}
.exhd{display:flex;align-items:flex-start;gap:8px}
@media(max-width:640px){
  .day{min-height:60px;padding:4px}
  .day .xs{display:none}
}

/* ---------- library ---------- */
.libitem{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--bg2)}
.libitem.in{border-color:rgba(45,212,167,.4)}
.fig{background:#0a0e13;border:1px solid var(--line);border-radius:10px;padding:6px;margin:10px 0}
.fig svg{display:block;width:100%;height:auto}
.steps{font-size:12.5px;color:var(--tx2);padding-left:16px;margin:8px 0 0}
.steps li{margin-bottom:3px}

/* ---------- stats ---------- */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:25px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.kpi .k{font-size:11.5px;color:var(--tx3);margin-top:4px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(5,1fr)}}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--tx2);margin-top:10px}

/* ---------- modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(5,8,12,.72);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sheet{
  background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;
  width:100%;max-width:620px;max-height:88vh;overflow:auto;padding:18px;
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@media(min-width:620px){.ov{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .top{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
#toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:200;
  background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:11px;font-weight:650;
  font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 30px rgba(0,0,0,.5);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:34px 16px;color:var(--tx3);font-size:13.5px}
</style>
</head>

<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo">T</div>
      <div>
        <h1>Training Scheduler</h1>
        <div class="sub"><span id="hdsub"></span><span id="savedhint" style="margin-left:8px;opacity:.7"></span></div>
      </div>
      <div class="spacer"></div>
      <button class="iconbtn" id="btnSettings" title="Settings">&#9881;</button>
    </div>
    <nav id="nav">
      <button data-p="today" class="on">Today</button>
      <button data-p="cal">Calendar</button>
      <button data-p="routine">My Routine</button>
      <button data-p="lib">Exercise Library</button>
      <button data-p="stats">Analysis</button>
    </nav>
  </div>
</header>

<div class="wrap"><div id="storagewarn"></div></div>

<div class="wrap">
  <div class="page on" id="p-today"></div>
  <div class="page" id="p-cal"></div>
  <div class="page" id="p-routine"></div>
  <div class="page" id="p-lib"></div>
  <div class="page" id="p-stats"></div>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

var C_NEAR = '#e6edf3', C_FAR = '#4a5867', C_PROP = '#54627a';
function _l(a,b,c,w){return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';}
function _db(w,c){return '<rect x="'+(w[0]-5)+'" y="'+(w[1]-2.6)+'" width="10" height="5.2" rx="1.6" fill="'+c+'"/>';}

function drawPose(P,accent,props){
  var s = '';
  props = props || [];
  if(props.indexOf('ground')>=0) s += _l([6,94],[114,94],C_PROP,1.6);
  if(props.indexOf('bar')>=0){ s += _l([28,13],[92,13],C_PROP,3); s += _l([28,9],[28,20],C_PROP,2)+_l([92,9],[92,20],C_PROP,2); }
  if(props.indexOf('wall')>=0) s += _l([44,14],[44,94],C_PROP,2.4);
  if(props.indexOf('bench')>=0) s += '<rect x="66" y="66" width="46" height="5" rx="2" fill="'+C_PROP+'"/><rect x="70" y="71" width="3" height="23" fill="'+C_PROP+'"/><rect x="104" y="71" width="3" height="23" fill="'+C_PROP+'"/>';
  if(props.indexOf('bench2')>=0) s += '<rect x="76" y="72" width="36" height="5" rx="2" fill="'+C_PROP+'"/><rect x="80" y="77" width="3" height="17" fill="'+C_PROP+'"/>';
  if(props.indexOf('box')>=0) s += '<rect x="72" y="74" width="38" height="20" rx="2" fill="none" stroke="'+C_PROP+'" stroke-width="2"/>';
  if(props.indexOf('rope')>=0) s += '<ellipse cx="60" cy="60" rx="34" ry="36" fill="none" stroke="'+C_PROP+'" stroke-width="1.6" stroke-dasharray="4 4"/>';
  /* far limbs first */
  s += _l(P.n,P.e2,C_FAR,3)+_l(P.e2,P.w2,C_FAR,3);
  s += _l(P.p,P.k2,C_FAR,3.2)+_l(P.k2,P.f2,C_FAR,3.2);
  /* torso + head */
  s += _l(P.n,P.p,accent,4.2);
  s += '<circle cx="'+P.h[0]+'" cy="'+P.h[1]+'" r="7" fill="'+accent+'"/>';
  /* near limbs */
  s += _l(P.p,P.k1,C_NEAR,3.6)+_l(P.k1,P.f1,C_NEAR,3.6);
  s += _l(P.n,P.e1,C_NEAR,3.4)+_l(P.e1,P.w1,C_NEAR,3.4);
  if(props.indexOf('db')>=0){ s += _db(P.w2,C_FAR)+_db(P.w1,C_NEAR); }
  return s;
}

function figureSVG(ex,accent){
  var ps = ex.poses, props = (ex.props||[]).concat(['ground']);
  if(ps.length===1){
    /* same canvas as the two-panel version so every card draws at one scale */
    return '<svg viewBox="0 0 268 100" xmlns="http://www.w3.org/2000/svg">'+
      '<g transform="translate(74,0)">'+drawPose(POSES[ps[0]],accent,props)+
      '<text x="60" y="8" font-size="8.5" fill="'+C_PROP+'" text-anchor="middle" font-family="sans-serif">HOLD THIS POSITION</text></g></svg>';
  }
  var arrow = '<g transform="translate(124,0)">'+
    '<line x1="2" y1="52" x2="18" y2="52" stroke="'+C_PROP+'" stroke-width="2"/>'+
    '<path d="M18 52 L12 48 L12 56 Z" fill="'+C_PROP+'"/>'+
    '<text x="10" y="42" font-size="9" fill="'+C_PROP+'" text-anchor="middle" font-family="sans-serif">'+(ex.mid||'')+'</text></g>';
  return '<svg viewBox="0 0 268 100" xmlns="http://www.w3.org/2000/svg">'+
    '<g>'+drawPose(POSES[ps[0]],accent,props)+'<text x="60" y="8" font-size="8.5" fill="'+C_PROP+'" text-anchor="middle" font-family="sans-serif">START</text></g>'+
    arrow+
    '<g transform="translate(148,0)">'+drawPose(POSES[ps[1]],accent,props)+'<text x="60" y="8" font-size="8.5" fill="'+C_PROP+'" text-anchor="middle" font-family="sans-serif">FINISH</text></g>'+
    '</svg>';
}

/* ============================================================
   3. STATE + DATES

var KEY = 'trainingScheduler.v1';

  if(!S.settings.hold) S.settings.hold = {mild:0, moderate:1, intensive:2};

/* Does this browser actually keep what we write? Probed once, up front, so the

    var v=localStorage.getItem(k);
    localStorage.removeItem(k);
    return v==='1';

})();
var LAST_SAVE = null;

    : 'saved';

/* pull every saved rep count onto the exercise's current ladder, so a value
   that has since been removed (like 12 push ups) cannot linger */
function snapReps(){
  Object.keys(S.logs||{}).forEach(function(d){
    var r=S.logs[d]; if(!r || !r.items) return;
    Object.keys(r.items).forEach(function(id){
      var ex=LIBMAP[id], it=r.items[id];
      if(!ex || !ex.reps || !ex.reps.length || it.reps==null) return;
      function snap(v){
        if(ex.reps.indexOf(v)>=0) return v;
        var best=ex.reps[0];
        ex.reps.forEach(function(o){ if(Math.abs(o-v)<Math.abs(best-v)) best=o; });
        return best;
      }
      var out = Array.isArray(it.reps) ? it.reps.map(snap) : snap(it.reps);
      it.reps = (Array.isArray(out) && out.every(function(v){ return v===out[0]; })) ? out[0] : out;
    });
  });
}
function pad(n){ return n<10?'0'+n:''+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pd(s){ var a=s.split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function addD(s,n){ var d=pd(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffD(a,b){ return Math.round((pd(a)-pd(b))/86400000); }
function today(){ return ymd(new Date()); }
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(s){ var d=pd(s); return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()].slice(0,3); }
function fmtLong(s){ var d=pd(s); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); }
function H(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============================================================
   4. SCHEDULING ENGINE
   Deterministic replay: walk day by day from the start date,
   using real records where they exist and assuming the plan
   was completed where they do not.
   ============================================================ */
function routineOf(cat){
  return S.routine.filter(function(id){ return LIBMAP[id] && LIBMAP[id].cat===cat; });
}
function restDaysFor(intensity){
  var r = S.settings.rest;
  return (intensity==='intensive') ? r.intensive : (intensity==='mild' ? r.mild : r.moderate);
}
/* how many sessions you repeat the same numbers before the target moves up.
   Mild means you left reps in the tank, so it moves next time. Intensive
   means you emptied the tank, so you consolidate before adding anything. */
function holdFor(eff){
  var h=S.settings.hold||{mild:0,moderate:1,intensive:2};
  return h[eff]!=null ? h[eff] : 1;
}
function rungIdx(ex,v){
  var arr=ex.reps||[], best=0;
  arr.forEach(function(o,i){ if(Math.abs(o-v)<Math.abs(arr[best]-v)) best=i; });
  return best;
}
/* one rung up on every set. At the top of the ladder, add a set and drop the
   reps back down a couple of rungs, keeping the descending shape you use. */
function stepUp(ex,cur){
  var arr=ex.reps||[]; if(!arr.length) return {sets:cur.sets, reps:copyReps(cur.reps), maxed:true};
  var reps=repsArr(cur), top=rungIdx(ex,reps[0]);
  if(top < arr.length-1){
    return {sets:cur.sets, reps:packReps(reps.map(function(v){
      return arr[Math.min(rungIdx(ex,v)+1, arr.length-1)];
    }))};
  }
  var maxSets=Math.min(S.settings.maxSets||4, Math.max.apply(null, ex.sets||[3]));
  if((cur.sets||1) < maxSets){
    var startI=Math.max(0, arr.length-3), nsets=(cur.sets||1)+1, out=[];
    for(var i=0;i<nsets;i++) out.push(arr[Math.max(0, startI-i)]);
    return {sets:nsets, reps:packReps(out), grew:true};
  }
  return {sets:cur.sets, reps:copyReps(cur.reps), maxed:true};
}
function shape(o){ return (o.sets||1)+'\u00d7'+(Array.isArray(o.reps)?o.reps.join('/'):o.reps); }
function nextRepUp(ex,cur){
  if(Array.isArray(cur)) return cur.map(function(v){ return nextRepUp(ex,v); });
  var arr = ex.reps||[]; var i = arr.indexOf(cur);
  return (i>=0 && i<arr.length-1) ? arr[i+1] : cur;
}

function simulate(){
  var start = S.settings.start;
  /* extend start back if any log predates it */
  Object.keys(S.logs).forEach(function(d){ if(d<start) start=d; });
  var T = today();
  var end = addD(T, HORIZON);

  var ctx = {
    last:{upper:null,core:null,lower:null,cardio:null},
    lastInt:{upper:'moderate',core:'moderate',lower:'moderate',cardio:'moderate'},
    lastDone:{}, lastPresc:{}, lastLogged:{}, repeats:{}, lastEff:{}, note:{},
    runLv:1, runHold:0, lastRun:null,
    cardioDates:[]
  };
  var plan={}, hist=[], notes={}, d=start, guard=0, ctxT=null;

  while(d<=end && guard++<4000){
    var entry = choose(d,ctx);
    plan[d] = entry;
    var rec = S.logs[d];
    var resolved = rec || planToRecord(d,entry);   /* no record = assume you did the plan */
    if(d<=T) hist.push({date:d, rec:resolved, assumed:!rec, plan:entry});
    apply(resolved, ctx, !!rec);
    if(d<=T){ var snap={}; Object.keys(ctx.note).forEach(function(k){ snap[k]=ctx.note[k]; }); notes[d]=snap; }
    if(d===T) ctxT = JSON.parse(JSON.stringify(ctx));   /* freeze the state as of today */
    d = addD(d,1);
  }
  return {plan:plan, hist:hist, notes:notes, ctx:ctx, ctxT:ctxT||ctx, start:start};
}

function choose(d,ctx){
  /* --- which muscle groups have recovered? --- */
  var elig=[];
  ['upper','core','lower'].forEach(function(g){
    if(routineOf(g).length===0) return;
    var since = ctx.last[g] ? diffD(d,ctx.last[g]) : 999;
    var need  = restDaysFor(ctx.lastInt[g]) + 1;
    if(since>=need) elig.push({g:g, since:since, need:need});
  });

  /* --- cardio window (cardio runs alongside a body part, it never blocks one) --- */
  var cardioEx = routineOf('cardio');
  var runs7 = ctx.cardioDates.filter(function(x){ var k=diffD(d,x); return k>=1 && k<=6; }).length;
  var gapC = ctx.last.cardio ? diffD(d,ctx.last.cardio) : 999;
  var needC = Math.max(2, restDaysFor(ctx.lastInt.cardio)+1);
  var cardioOk = cardioEx.length>0 && runs7 < S.settings.runsPerWeek && gapC>=needC;
  var cardioNow = cardioOk && gapC>=S.settings.cardioGap;

  /* a cardio day stands on its own: running plus whatever you pinned to it.
     Add body parts by hand from the day's "+ Add body part" picker. */
  if(cardioNow) return cardioEntry(d,ctx,'Cardio day \u2014 '+runs7+' of '+S.settings.runsPerWeek+' used in the last 7 days');

  elig.sort(function(a,b){
    if(b.since!==a.since) return b.since-a.since;
    return GORDER.indexOf(a.g)-GORDER.indexOf(b.g);
  });
  var groups = pickGroups(d,ctx,elig);
  if(groups.length){
    var why = groups.map(function(g){
      var f=null; elig.forEach(function(x){ if(x.g===g) f=x; });
      return GROUPS[g].short+(f.since>900?' is new':' rested '+f.since+' day'+(f.since===1?'':'s'));
    }).join(', ');
    return trimSession(sessionEntry(d,ctx,groups,why));
  }
  if(cardioOk) return cardioEntry(d,ctx,'Every body part is still recovering, so today is cardio only');
  return {date:d, group:'rest', groups:[], items:[], why:'Every body part is still inside its recovery window'};
}
function itemList(x){
  if(!x || !x.items) return [];
  if(Array.isArray(x.items)) return x.items.filter(function(o){ return !o.skipped; });
  return Object.keys(x.items).filter(function(k){ return !x.items[k].skipped; })
    .map(function(k){ var o=x.items[k]; return {id:k, sets:o.sets, reps:o.reps, lv:o.lv, bonus:o.bonus}; });
}
function idsOf(x){ return itemList(x).map(function(o){ return o.id; }); }
/* true when a day pairs cardio on top of a body-part session */
/* the body parts a day actually contains, read straight off its exercises */
function catsOf(x){
  var seen={}, out=[];
  itemList(x).forEach(function(o){
    if(o.bonus) return;                      /* extras do not define the session */
    var c = LIBMAP[o.id] && LIBMAP[o.id].cat;
    if(c && c!=='cardio' && !seen[c]){ seen[c]=1; out.push(c); }
  });
  return out;
}
function sessionTitle(x){
  var gs = catsOf(x);
  if(!gs.length) return parallelCardio2(x) ? 'Cardio' : 'Rest Day';
  if(gs.length===1) return GROUPS[gs[0]].name;
  return gs.map(function(g){ return GROUPS[g].short; }).join(' + ');
}
function sessionShort(x){
  var gs = catsOf(x);
  if(!gs.length) return parallelCardio2(x) ? 'Cardio' : 'Rest';
  return gs.map(function(g){ return GROUPS[g].short; }).join('+');
}
function parallelCardio2(x){
  return idsOf(x).some(function(id){ return LIBMAP[id] && LIBMAP[id].cat==='cardio'; });
}
function parallelCardio(x){ return !!x && catsOf(x).length>0 && parallelCardio2(x); }
function barStyle(x){
  var gs=catsOf(x);
  if(!gs.length) return parallelCardio2(x) ? 'var(--cardio)' : 'var(--rest)';
  if(gs.length===1) return GROUPS[gs[0]].color;
  var st=gs.map(function(g,i){ return GROUPS[g].color+' '+Math.round(i*100/gs.length)+'% '+Math.round((i+1)*100/gs.length)+'%'; });
  return 'linear-gradient(180deg,'+st.join(',')+')';
}

function pickExercises(g,ctx,d){
  var ids = routineOf(g).slice();
  ids.sort(function(a,b){
    var la = ctx.lastDone[a] ? diffD(d,ctx.lastDone[a]) : 999;
    var lb = ctx.lastDone[b] ? diffD(d,ctx.lastDone[b]) : 999;
    if(lb!==la) return lb-la;
    return S.routine.indexOf(a)-S.routine.indexOf(b);
  });
  return ids.slice(0, S.settings.maxPerGroup||3);
}
function prescribe(id,ctx){
  var ex = LIBMAP[id], p = ctx.lastPresc[id] || {sets:ex.def.sets, reps:ex.def.reps};
  return {id:id, sets:p.sets, reps:copyReps(p.reps)};
}
/* choose which body parts share a day: keep adding recovered groups until the
   session is long enough. Core is never allowed to stand on its own. */
function pickGroups(d,ctx,elig){
  var min=S.settings.minPerSession||3, chosen=[], n=0;
  elig.forEach(function(e){
    if(chosen.length>=3) return;
    if(chosen.length>=1 && n>=min && !(chosen.length===1 && chosen[0]==='core')) return;
    chosen.push(e.g);
    n += Math.min(routineOf(e.g).length, S.settings.maxPerGroup||3);
  });
  if(chosen.length===1 && chosen[0]==='core') return [];   /* core alone is not a session */
  return chosen;
}
function buildSession(d,ctx,groups){
  var items=[], max=S.settings.maxPerSession||5;
  groups.forEach(function(g){
    pickExercises(g,ctx,d).forEach(function(id){ if(items.length<max) items.push(prescribe(id,ctx)); });
  });
  return items;
}
function sessionEntry(d,ctx,groups,why){
  return {date:d, group:groups[0], groups:groups.slice(), items:buildSession(d,ctx,groups), why:why};
}
/* never more than maxPerSession exercises in a day. Cardio and pinned extras
   keep their place, ordinary exercises drop off the end of the rotation. */
function trimSession(entry){
  var max=S.settings.maxPerSession||4, items=entry.items;
  for(var i=items.length-1; i>=0 && items.length>max; i--){
    var it=items[i], ex=LIBMAP[it.id];
    if(it.bonus || (ex && ex.cat==='cardio')) continue;
    if(items.filter(function(o){ var e2=LIBMAP[o.id]; return !o.bonus && e2 && e2.cat!=='cardio'; }).length<=1) break;
    items.splice(i,1);
  }
  return entry;
}
function cardioItem(d,ctx){
  var ids = routineOf('cardio');
  var id  = ids.indexOf('run')>=0 ? 'run' : ids[0];
  var ex  = LIBMAP[id];
  if(ex.unit==='dist'){
    var lv = ctx.runLv;
    if(ctx.lastRun && diffD(d,ctx.lastRun)>=14) lv = 1;
    return {id:id, lv:lv};
  }
  var p = ctx.lastPresc[id] || {sets:ex.def.sets, reps:ex.def.reps};
  return {id:id, sets:p.sets, reps:p.reps};
}
function cardioEntry(d,ctx,why){
  var it = cardioItem(d,ctx), note='';
  if(it.lv===1 && ctx.lastRun && diffD(d,ctx.lastRun)>=14) note=' (restarting easy after a 2+ week break)';
  var e = {date:d, group:'cardio', items:[it], cardio:true, why:why+note};
  addPinned(e,ctx);
  return trimSession(e);
}
/* exercises you can reach while you are out running get added to every cardio
   day, on top of the plan, without resetting that body part's recovery */
function addPinned(entry,ctx){
  (S.pinned||[]).forEach(function(id){
    if(!LIBMAP[id] || S.routine.indexOf(id)<0) return;
    if(entry.items.some(function(it){ return it.id===id; })) return;
    var it = prescribe(id,ctx); it.bonus = true;
    entry.items.push(it);
    entry.why += ' \u00b7 plus '+LIBMAP[id].name+', which you pinned to cardio days';
  });
}

/* turn a planned day into an "assumed completed" record */
function planToRecord(d,entry){
  if(entry.group==='rest') return {date:d, type:'rest', group:'rest', items:{}};
  var items={};
  entry.items.forEach(function(it){
    items[it.id] = (it.lv!=null) ? {lv:it.lv} : {sets:it.sets, reps:copyReps(it.reps)};
    if(it.bonus) items[it.id].bonus = true;
  });
  return {date:d, type:'workout', group:entry.group, intensity:'moderate', items:items};
}

/* fold a day's outcome into the running context */
function apply(rec,ctx,explicit){
  if(!rec || rec.type==='skip' || rec.type==='rest' || rec.group==='rest') return;
  var cats = {};
  Object.keys(rec.items||{}).forEach(function(id){
    var it = rec.items[id], ex = LIBMAP[id];
    if(!ex || it.skipped) return;          /* a skipped exercise never counts as trained */
    if(!it.bonus) cats[ex.cat] = 1;        /* a pinned extra does not reset that body part */
    ctx.lastDone[id] = rec.date;
    if(ex.unit==='dist'){
      ctx.lastRun = rec.date;
      var lv = it.lv||1;
      if(lv===ctx.runLv){ ctx.runHold++; }
      else { ctx.runLv = lv; ctx.runHold = 1; }
      if(ctx.runHold >= (LADDER_HOLD[ctx.runLv]||99)){ ctx.runLv = Math.min(4, ctx.runLv+1); ctx.runHold = 0; }
    } else if(it.sets!=null && explicit){
      /* what you actually did is the base for next time. How hard it felt
         decides whether the target moves up or sits still to consolidate. */
      var prev = ctx.lastLogged[id];
      var same = prev && prev.sets===it.sets && JSON.stringify(prev.reps)===JSON.stringify(it.reps);
      ctx.repeats[id] = same ? (ctx.repeats[id]||0)+1 : 1;
      ctx.lastLogged[id] = {sets:it.sets, reps:copyReps(it.reps)};
      var eff = rec.intensity||'moderate';
      ctx.lastEff[id] = eff;
      var did = {sets:it.sets, reps:copyReps(it.reps)};
      var need = holdFor(eff);
      if(ctx.repeats[id] > need){
        var up = stepUp(ex,did);
        ctx.lastPresc[id] = {sets:up.sets, reps:copyReps(up.reps)};
        ctx.note[id] = up.maxed
          ? 'Top of the ladder at '+shape(did)+'. Swap in a harder move from the library when you are ready.'
          : (up.grew ? 'Ladder topped out, so this becomes '+shape(up)+' \u2014 an extra set at easier reps.'
                     : 'Stepped up to '+shape(up)+' after a '+eff+' session.');
      } else {
        ctx.lastPresc[id] = did;
        var left = need - ctx.repeats[id] + 1;
        ctx.note[id] = 'Holding '+shape(did)+' \u2014 '+left+' more session'+(left===1?'':'s')
          + ' to consolidate that '+eff+' effort, then it steps up.';
      }
    }
  });
  Object.keys(cats).forEach(function(c){
    ctx.last[c] = rec.date;
    ctx.lastInt[c] = rec.intensity || 'moderate';
    if(c==='cardio') ctx.cardioDates.push(rec.date);
  });
}
/* ============================================================
   5. SHARED UI HELPERS
   ============================================================ */
var SIM, PAGE='today', calMonth;

function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},1900); }
function gname(g){ return g==='rest' ? 'Rest Day' : GROUPS[g].name; }
function gshort(g){ return g==='rest' ? 'Rest' : GROUPS[g].short; }
function gtag(g){ return '<span class="tag t-'+g+'"><span class="dot bg-'+g+'"></span>'+gshort(g)+'</span>'; }
function unitLabel(ex){ return ex.unit==='sec'?'Hold time':(ex.unit==='min'?'Minutes':(ex.unit==='dist'?'Distance':'Reps per set')); }
function unitSuffix(ex){ return ex.unit==='sec'?'s':(ex.unit==='min'?'m':''); }
function repWord(ex){ return ex.unit==='sec'?'Hold':(ex.unit==='min'?'Block':'Rep'); }
/* reps can differ from set to set: stored as a number when they are all the
   same, or as an array like [30,25,20] when they are not */
function repsArr(it){
  var n=Math.max(1, it.sets||1), a=[];
  if(Array.isArray(it.reps)){
    a=it.reps.slice(0,n);
    while(a.length<n) a.push(a[a.length-1]||0);
    return a;
  }
  for(var i=0;i<n;i++) a.push(it.reps||0);
  return a;
}
function repsSame(a){ return a.every(function(v){ return v===a[0]; }); }
function packReps(a){ return repsSame(a) ? a[0] : a.slice(); }
function repsTotal(it){ return repsArr(it).reduce(function(x,y){ return x+(y||0); },0); }
function repsLabel(it,ex){

}
function copyReps(r){ return Array.isArray(r) ? r.slice() : r; }

function ensureRec(date){
  if(S.logs[date]) return S.logs[date];
  var entry = SIM.plan[date] || {group:'rest', items:[]};
  var r = planToRecord(date, entry);
  r.logged = true;
  S.logs[date] = r;
  return r;
}
function recOf(date){ return S.logs[date] || null; }

/* --- write actions --- */
function setSets(date,id,v){
  var r=ensureRec(date), it=r.items[id]=r.items[id]||{};
  var old=repsArr(it), fill=old[old.length-1]||LIBMAP[id].def.reps, out=[];
  for(var i=0;i<v;i++) out.push(old[i]!=null?old[i]:fill);
  it.sets=v; it.reps=packReps(out); delete it.skipped; r.type='workout';
  save(); refresh(); toast('Saved \u2713  '+LIBMAP[id].name+' \u00b7 '+v+' set'+(v===1?'':'s'));
}
function setReps(date,id,idx,v){
  var r=ensureRec(date), it=r.items[id]=r.items[id]||{};
  var a=repsArr(it); a[idx]=v;
  it.reps=packReps(a); delete it.skipped; r.type='workout';
  var ex=LIBMAP[id], u=ex.unit==='sec'?' second hold':(ex.unit==='min'?' minutes':' reps');
  save(); refresh();
  toast('Saved \u2713  '+ex.name+' \u00b7 '+(a.length>1?repWord(ex)+' '+(idx+1)+': ':'')+v+u);
}
function setLv(date,id,v){ var r=ensureRec(date); r.items[id]={lv:v}; r.type='workout'; save(); refresh(); toast('Saved \u2713  ran '+distOf(v).label); }
function setIntensity(date,v){ var r=ensureRec(date); r.intensity=v; r.type='workout'; save(); refresh();
  toast('Saved \u2713  '+v.charAt(0).toUpperCase()+v.slice(1)+' \u2014 rests at least '+restDaysFor(v)+' day'+(restDaysFor(v)===1?'':'s')+(v==='mild'?', and next time gets harder':'')); }
function skipEx(date,id){
  var r=ensureRec(date); r.items[id]={skipped:true}; r.type='workout'; save(); refresh();
  toast(LIBMAP[id].name+' marked as not done');
}
function unskipEx(date,id){
  var r=ensureRec(date), plan=SIM.plan[date], src=null;
  (plan&&plan.items||[]).forEach(function(it){ if(it.id===id) src=it; });
  if(!src){ var ex=LIBMAP[id]; src = ex.unit==='dist' ? {lv:SIM.ctxT.runLv} : {sets:ex.def.sets, reps:ex.def.reps}; }
  r.items[id] = (src.lv!=null) ? {lv:src.lv} : {sets:src.sets, reps:src.reps};
  save(); refresh();
}
function dayCount(date){
  var r=S.logs[date];
  return r ? itemList(r).length : idsOf(SIM.plan[date]||{}).length;
}
function dayFull(date){ return dayCount(date) >= (S.settings.maxPerSession||4); }
function restedOrder(date){
  var ctx=SIM.ctxT;
  return ['upper','core','lower'].filter(function(g){ return routineOf(g).length; })
    .sort(function(a,b){
      var la=ctx.last[a]?diffD(date,ctx.last[a]):999, lb=ctx.last[b]?diffD(date,ctx.last[b]):999;
      if(lb!==la) return lb-la;
      return GORDER.indexOf(a)-GORDER.indexOf(b);
    });
}
function partsIn(date){
  var r=S.logs[date], have={};
  itemList(r||SIM.plan[date]||{}).forEach(function(o){ if(LIBMAP[o.id]) have[LIBMAP[o.id].cat]=1; });
  return have;
}
/* add a whole body part. With no group given it takes the most rested one. */
function addBodyPart(date,g,silent){
  var r=ensureRec(date), ctx=SIM.ctxT, have=partsIn(date);
  if(!g){
    var cand=restedOrder(date).filter(function(x){ return !have[x]; });
    if(!cand.length){ if(!silent) toast('Every body part is already in this day'); return false; }
    g=cand[0];
  }
  var added=0;
  pickExercises(g,ctx,date).forEach(function(id){
    if(r.items[id] || dayCount(date)>= (S.settings.maxPerSession||4)) return;
    var p=prescribe(id,ctx); r.items[id]={sets:p.sets, reps:copyReps(p.reps)}; added++;
  });
  r.type='workout'; r.logged=true;
  save(); refresh();
  if(!silent){
    toast(added ? 'Saved \u2713  '+GROUPS[g].name+' added to '+fmt(date)
                : 'No room \u2014 this day already holds '+(S.settings.maxPerSession||4)+' exercises');
  }
  return added>0;
}
function addExerciseToDay(date,id){
  var r=ensureRec(date), ctx=SIM.ctxT;
  if(r.items[id] && !r.items[id].skipped){ toast(LIBMAP[id].name+' is already in this day'); return; }
  if(dayFull(date)){ toast('No room \u2014 this day already holds '+(S.settings.maxPerSession||4)+' exercises'); return; }
  var ex=LIBMAP[id];
  r.items[id] = ex.unit==='dist' ? {lv:ctx.runLv} : (function(){ var p=prescribe(id,ctx); return {sets:p.sets, reps:copyReps(p.reps)}; })();
  r.type='workout'; r.logged=true;
  save(); refresh(); toast('Saved \u2713  '+ex.name+' added to '+fmt(date));
}
function removeFromDay(date,id){
  var r=ensureRec(date); delete r.items[id]; r.type='workout'; r.logged=true;
  save(); refresh(); toast(LIBMAP[id].name+' removed from '+fmt(date));
}
function openAddPart(d){ openSheet(addPartHTML(d), {t:'add', d:d}); }
function addPartHTML(d){

  if(mine.length){

        +  '>+ '+H(ex.name)+'</button>';

    here.forEach(function(o){
      var ex=LIBMAP[o.id]; if(!ex) return;
      h += '<button class="chip" onclick="removeFromDay(\''+d+'\',\''+o.id+'\')">'+H(ex.name)+' &nbsp;&#10005;</button>';
    });
    h += '</div>';

  h += '<div class="tiny" style="margin-top:16px">Your limit is '+max+' exercises a day. Change it under Settings \u2192 Maximum exercises per session.</div>';
  return h;
}
/* one-off tidy-up: records written by an older version could hold a single
   body part. Fix today and anything still ahead, leave real history alone. */
function repairShort(){
  var T=today(), changed=false;
  Object.keys(S.logs).forEach(function(d){
    if(d<T) return;
    var r=S.logs[d];
    if(!r || r.type==='skip' || r.type==='rest') return;
    if(Object.keys(r.items||{}).some(function(k){ return r.items[k].skipped; })) return;
    function shape(){
      var list=itemList(S.logs[d]).filter(function(o){ return LIBMAP[o.id] && LIBMAP[o.id].cat!=='cardio' && !o.bonus; });
      var c={}; list.forEach(function(o){ c[LIBMAP[o.id].cat]=1; });
      return {n:list.length, cats:Object.keys(c)};
    }
    var sh=shape(), guard=0;
    if(!sh.n) return;
    while(guard++<3 && (sh.n<Math.min(2,S.settings.minPerSession) || (sh.cats.length===1 && sh.cats[0]==='core'))){
      if(!addBodyPart(d,null,true)) break;
      changed=true; sh=shape();
    }
  });
  if(changed){ save(); refresh(); }
}
function markSkip(date){ S.logs[date]={date:date,type:'skip',group:'rest',items:{},logged:true}; save(); refresh(); toast('Saved \u2713  '+fmt(date)+' marked as no exercise'); }
function clearRec(date){ delete S.logs[date]; save(); refresh(); toast('Record cleared \u2014 back to the plan'); }
function swapGroup(date,g){
  var entry, ctx = SIM.ctxT;
  if(g==='rest'){ S.logs[date]={date:date,type:'rest',group:'rest',items:{},logged:true}; }
  else if(g==='cardio'){ entry = cardioEntry(date,ctx,''); }
  else {
    var groups=[g], cnt=Math.min(routineOf(g).length, S.settings.maxPerGroup||3);
    var others=['upper','core','lower'].filter(function(x){ return x!==g && routineOf(x).length; });
    others.sort(function(a,b){
      var la=ctx.last[a]?diffD(date,ctx.last[a]):999, lb=ctx.last[b]?diffD(date,ctx.last[b]):999;
      return lb-la;
    });
    while(others.length && (cnt < (S.settings.minPerSession||3) || (groups.length===1 && groups[0]==='core'))){
      var g2=others.shift(); groups.push(g2); cnt+=Math.min(routineOf(g2).length, S.settings.maxPerGroup||3);
    }
    entry = sessionEntry(date,ctx,groups,'');
  }
  if(entry){
    var r = planToRecord(date, entry); r.logged=true;
    r.intensity=(S.logs[date]&&S.logs[date].intensity)||'moderate';
    S.logs[date]=r;
  }
  save(); refresh();
  if(SHEET && SHEET.t==='swap') openDay(date);
  toast('Session changed to '+(entry?sessionTitle(entry):'Rest Day'));
}

/* --- session editor (used on Today and inside the day sheet) --- */
function withCurrent(vals,cur){
  var a=(vals||[]).slice();
  if(cur!=null && a.indexOf(cur)<0){ a.push(cur); a.sort(function(x,y){ return x-y; }); }
  return a;
}
function setChips(date,ex,it){
  return '<div class="chips">'+withCurrent(ex.sets||[1,2,3], it.sets).map(function(v){
    return '<button class="chip'+(v===(it.sets||1)?' on':'')+'" onclick="setSets(\''+date+'\',\''+ex.id+'\','+v+')">'+v+'</button>';
  }).join('')+'</div>';
}
function repChips(date,ex,it,idx){
  var cur=repsArr(it)[idx];
  return '<div class="chips">'+withCurrent(ex.reps, cur).map(function(v){
    return '<button class="chip rep'+(v===cur?' on':'')+'" onclick="setReps(\''+date+'\',\''+ex.id+'\','+idx+','+v+')">'+v+unitSuffix(ex)+'</button>';
  }).join('')+'</div>';
}
function exCard(date,it,editable){
  var ex = LIBMAP[it.id]; if(!ex) return '';

  h += '<div class="exhd"><div><h4>'+H(ex.name)+(it.bonus?' <span class="tag t-cardio" style="vertical-align:2px">extra</span>':'')+'</h4>'
    +  '<div class="presc">'+H(ex.part)+(ex.gear!=='None'?' &middot; '+H(ex.gear):'')
    +  (it.bonus?'<br>On top of the plan because you pass a spot for it while running. Does not change recovery.':'')+'</div></div>';
  h += '<div style="margin-left:auto;display:flex;gap:6px;flex:none">';

    h += it.skipped
      ? '<button class="figbtn" style="margin:0;color:var(--ok);border-color:rgba(45,212,167,.4)" onclick="unskipEx(\''+date+'\',\''+ex.id+'\')">Undo</button>'
      : '<button class="figbtn" style="margin:0" onclick="skipEx(\''+date+'\',\''+ex.id+'\')">Skip</button>';
  }

  if(it.skipped){ return h+'<div class="tiny" style="margin-top:8px">Not done today. It does not count towards this body part, so it comes back sooner.</div></div>'; }

  if(note) h += '<div class="tiny" style="margin-top:9px;padding:8px 10px;background:var(--card2);border-radius:8px;border-left:2px solid '+GROUPS[ex.cat].color+'">'+H(note)+'</div>';
  else if(editable && ex.unit!=='dist' && !(SIM.ctxT.lastLogged||{})[ex.id])
    h += '<div class="tiny" style="margin-top:9px">Log what you did and how hard it felt, and the next target adjusts itself.</div>';
  if(ex.unit==='dist'){
    var lv = it.lv||1;
    h += '<div class="lbl">Distance '+(editable?'— tap what you ran':'— target')+'</div><div class="chips">';
    DIST.forEach(function(D){
      h += '<button class="chip'+(D.lv===lv?' on':'')+'"'+(editable?' onclick="setLv(\''+date+'\',\''+ex.id+'\','+D.lv+')"':' disabled')+'>'+D.label+'</button>';

      else arr.forEach(function(v,i){
        h += '<div class="lbl">'+repWord(ex)+' '+(i+1)+'</div>'+repChips(date,ex,it,i);
      });
      h += '</div>';
    } else {
      h += '<div class="lbl">Target</div><div class="chips"><span class="chip on">'+repsLabel(it,ex).replace('x',' &times; ')+'</span></div>';

function intensityBlock(date,cur){

function sessionEditor(date){

      : entry.items;

function itemsLine(e){
  if(!e.items||!e.items.length) return 'Recovery';
  return e.items.filter(function(it){return !it.skipped;}).map(function(it){
    var ex=LIBMAP[it.id]; if(!ex) return '';
    if(it.lv!=null) return ex.name+' '+distOf(it.lv).short;
    return ex.name+' '+repsLabel(it,ex);
  }).join(' \u00b7 ');
}
function statusOf(T){
  var out=[], ctx=SIM.ctxT;
  var runs7 = ctx.cardioDates.filter(function(x){ return diffD(T,x)>=0 && diffD(T,x)<=6; }).length;
  out.push('Cardio this week: <b>'+runs7+' / '+S.settings.runsPerWeek+'</b>');
  out.push('Running target: <b>'+distOf(ctx.runLv).label+'</b>');
  var s=streak();
  out.push('Active streak: <b>'+s+' day'+(s===1?'':'s')+'</b>');
  ['upper','core','lower'].forEach(function(g){
    if(!routineOf(g).length || !ctx.last[g]) return;
    var since=diffD(T,ctx.last[g]), need=restDaysFor(ctx.lastInt[g])+1, left=need-since;
    out.push(GROUPS[g].short+': <b>'+(left<=0 ? 'ready' : 'ready in '+left+' day'+(left===1?'':'s'))+'</b>');
  });
  return out;
}
function streak(){
  var n=0, d=today();
  while(true){
    var e=SIM.hist.filter(function(x){return x.date===d;})[0];
    if(!e) break;
    if(e.rec.type==='skip') break;
    if(e.rec.group==='rest'){ d=addD(d,-1); continue; }
    n++; d=addD(d,-1);
    if(n>400) break;
  }
  return n;
}

  h += '<button class="iconbtn" onclick="moveMonth(1)">&#8250;</button>';
  h += '<button class="btn sm ghost" style="margin-left:auto" onclick="calMonth=null;render()">This month</button></div>';

  h += '<div class="cal">'+DOW.map(function(d){return '<div class="dow">'+d+'</div>';}).join('');
  for(var i=0;i<start;i++) h += '<div class="day blank"></div>';
  for(var day=1;day<=days;day++){
    var d = y+'-'+pad(m)+'-'+pad(day);
    var e = SIM.plan[d];
    var rec = recOf(d);
    if(d < SIM.start){
      h += '<div class="day blank" style="opacity:.32"><div class="n">'+day+'</div></div>';
      continue;
    }
    var src = (rec && rec.type!=='skip') ? rec : e;
    var skipped = rec && rec.type==='skip';
    var g = skipped ? 'skip' : (catsOf(src)[0] || (parallelCardio2(src)?'cardio':'rest'));
    var cls='day'+(d===T?' today':'')+(d<T?' past':'');
    var col = skipped?'var(--bad)':(g==='rest'?'var(--rest)':GROUPS[g].color);
    var mark = rec ? (skipped?'&#10007;':'&#9679;') : '';
    var par = !skipped && parallelCardio(src);
    var label = skipped ? 'Skipped' : sessionShort(src);
    h += '<div class="'+cls+'" onclick="openDay(\''+d+'\')">';
    h += '<div class="bar" style="background:'+(skipped?'var(--bad)':barStyle(src))+'"></div>';
    h += '<div class="mk" style="color:'+col+'">'+mark+'</div>';
    h += '<div class="n">'+day+'</div>';
    h += '<div class="g" style="color:'+col+'">'+H(label)+(par?'<span style="color:var(--cardio)"> + Cardio</span>':'')+'</div>';
    h += '<div class="xs">'+H(shortItems(rec,e))+'</div>';
    if(d<=T){
      h += g==='skip'
        ? '<button class="skipbtn undo" title="Undo — put the planned session back" onclick="event.stopPropagation();toggleSkip(\''+d+'\')">&#8635;</button>'
        : '<button class="skipbtn" title="I did not exercise on this day" onclick="event.stopPropagation();toggleSkip(\''+d+'\')">&#10005;</button>';
    }
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="legend">'+GORDER.map(function(g){return '<span><span class="dot bg-'+g+'" style="display:inline-block;margin-right:5px"></span>'+GROUPS[g].name+'</span>';}).join('')
     + '<span><span class="dot bg-rest" style="display:inline-block;margin-right:5px"></span>Rest</span>'
     + '<span style="color:var(--tx3)">&#9679; recorded by you &nbsp;&nbsp; no dot = assumed done as planned</span></div>';

  h += '<div class="card" style="margin-top:16px"><b style="font-size:13.5px">How this calendar is built</b>'
     + '<div class="tiny" style="margin-top:6px;line-height:1.6">Every day is replayed from your history. Days you did not record are assumed completed exactly as planned, at Moderate effort. '
     + 'Change or skip any day and everything after it is recalculated instantly.<br><br>'
     + 'A body part comes back after <b>'+S.settings.rest.mild+' day</b> if you logged it Mild, <b>'+S.settings.rest.moderate+' days</b> if Moderate and <b>'+S.settings.rest.intensive+' days</b> if Intensive. '
     + 'Cardio is not a body part, so it is added on top of a session rather than replacing it, capped at <b>'+S.settings.runsPerWeek+' per week</b>. '
     + 'Use the small &#10005; on any past day to record that you did not exercise.</div></div>';

  document.getElementById('p-cal').innerHTML=h;
}
function shortItems(rec,e){
  if(rec && rec.type==='skip') return '';
  var items = rec && rec.items ? Object.keys(rec.items).filter(function(id){return !rec.items[id].skipped;}).map(function(id){var o=rec.items[id];return {id:id,sets:o.sets,reps:o.reps,lv:o.lv};}) : (e?e.items:[]);
  if(!items||!items.length) return 'recover';
  return items.map(function(it){
    var ex=LIBMAP[it.id]; if(!ex) return '';
    if(it.lv!=null) return distOf(it.lv).short;
    return ex.name.replace(/^Dumbbell /,'DB ')+' '+repsLabel(it,ex);
  }).join(', ');
}
function toggleSkip(d){
  var r=S.logs[d];

}
function moveMonth(n){
  var y=+calMonth.slice(0,4), m=+calMonth.slice(5,7)+n;

}
function stateTag(d){

  if(rec) return '<span class="tag t-lower">&#10003; Recorded by you</span>';
  return '<span class="tag t-rest">Assumed done as planned</span>';
}

  }

function exportData(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='training-data-'+today()+'.json'; a.click();
  toast('Backup downloaded');
}
function importPick(){
  var inp = document.getElementById('importFile');
  if(inp) inp.click();
}
function importData(file){
  if(!file) return;
  var fr = new FileReader();
  fr.onerror = function(){ alert('Could not read that file.'); };
  fr.onload = function(){
    var d;
    try{ d = JSON.parse(fr.result); }
    catch(e){
      alert('That file is not readable as a backup.\n\nIt should be the .json file this app downloads when you tap "Download backup".');
      return;
    }
    if(!d || typeof d !== 'object' || !Array.isArray(d.routine) || !d.logs || typeof d.logs !== 'object'){
      alert('That does not look like a Training Scheduler backup.\n\nExpected a .json file containing your routine and your logs.');
      return;
    }
    var days = Object.keys(d.logs).length;
    if(!confirm('Restore this backup?\n\n' + days + ' logged day' + (days===1?'':'s') +
                ' will replace everything currently in the app. This cannot be undone.')) return;
    S = null;
    load(d);            /* same version-migration chain as a normal startup */
    save();
    refresh();
    closeSheet();
    toast('Restored ' + days + ' logged day' + (days===1?'':'s'));
  };
  fr.readAsText(file);
}

  Array.prototype.forEach.call(document.querySelectorAll('.page'),function(el){ el.classList.toggle('on', el.id==='p-'+p); });

         km:0, runs:[], reps:{}, secs:{}, count:{}, best:{}, intensity:{mild:0,moderate:0,intensive:0},
         logged:0, assumed:0, weeks:{}, days:0, firstDate:null, groupTotal:0, exSkipped:0,
         prog:{upper:[],core:[],lower:[]}, presc:{}};
  SIM.hist.forEach(function(e){
    var r=e.rec; A.days++;
    if(!A.firstDate) A.firstDate=e.date;
    if(r.type==='skip'){ A.skipped++; return; }
    if(r.group==='rest'||r.type==='rest'){ A.rest++; return; }
    var cats={}; idsOf(r).forEach(function(id){ if(LIBMAP[id]) cats[LIBMAP[id].cat]=1; });
    if(!Object.keys(cats).length){ A.skipped++; return; }   /* every exercise was skipped */
    A.sessions++;
    Object.keys(cats).forEach(function(c){ A.byGroup[c]=(A.byGroup[c]||0)+1; A.groupTotal=(A.groupTotal||0)+1; });
    if(e.assumed) A.assumed++; else A.logged++;
    A.intensity[r.intensity||'moderate'] = (A.intensity[r.intensity||'moderate']||0)+1;
    var wk=weekKey(e.date);
    A.weeks[wk]=A.weeks[wk]||{upper:0,core:0,lower:0,cardio:0};
    Object.keys(cats).forEach(function(c){ A.weeks[wk][c]++; });
    ['upper','core','lower'].forEach(function(g){
      var parts=[], tot=0, secs=0;
      Object.keys(r.items||{}).forEach(function(id){
        var it=r.items[id], ex=LIBMAP[id];
        if(!ex || it.skipped || it.bonus || ex.cat!==g) return;   /* pinned extras are not a session */
        if(ex.unit==='dist') return;
        if(ex.unit==='sec' || ex.unit==='min'){ secs += repsTotal(it)*(ex.unit==='min'?60:1); return; }
        var v=repsTotal(it); if(!v) return;
        parts.push({id:id, v:v, sets:it.sets||1, reps:copyReps(it.reps)});
        tot+=v;
      });
      if(parts.length || secs) A.prog[g].push({date:e.date, assumed:e.assumed, parts:parts, total:tot, secs:secs});
    });
    Object.keys(r.items||{}).forEach(function(id){
      var it=r.items[id], ex=LIBMAP[id]; if(!ex || it.skipped) return;
      A.count[id]=(A.count[id]||0)+1;
      if(it.sets!=null && ex.unit!=='dist' && !it.bonus){
        A.presc[id]=A.presc[id]||[];
        A.presc[id].push({date:e.date, sets:it.sets||1, reps:copyReps(it.reps), v:repsTotal(it)});
      }
      if(ex.unit==='dist'){
        var D=distOf(it.lv||1); A.km+=D.km; A.runs.push({date:e.date, km:D.km, lv:D.lv, assumed:e.assumed});
      } else if(ex.unit==='sec'){
        A.secs[id]=(A.secs[id]||0)+repsTotal(it);
        A.best[id]=Math.max(A.best[id]||0, Math.max.apply(null,repsArr(it)));
      } else if(ex.unit==='min'){
        A.secs[id]=(A.secs[id]||0)+repsTotal(it)*60;
        A.best[id]=Math.max(A.best[id]||0, Math.max.apply(null,repsArr(it)));
      } else {
        A.reps[id]=(A.reps[id]||0)+repsTotal(it);
        A.best[id]=Math.max(A.best[id]||0, repsTotal(it));
      }
    });
  });
  return A;
}

/* least-squares drift across the window, as a percentage of the average */
function trendOf(vals){
  var n=vals.length;
  if(n<2) return {dir:'flat', pct:0, a:vals[0]||0, b:vals[0]||0};
  var sx=0,sy=0,sxy=0,sxx=0;
  for(var i=0;i<n;i++){ sx+=i; sy+=vals[i]; sxy+=i*vals[i]; sxx+=i*i; }
  var den=(n*sxx-sx*sx)||1, slope=(n*sxy-sx*sy)/den, mean=(sy/n)||1;
  var inter=(sy-slope*sx)/n;
  var pct=Math.round(slope*(n-1)/mean*100);
  return {dir: pct>5?'up':(pct<-5?'down':'flat'), pct:pct, a:inter, b:inter+slope*(n-1)};
}
var SHADES={
  upper:['#7c8cff','#a9b3ff','#5566e0','#c8ceff','#3d4bc4'],
  core :['#f5a524','#ffc772','#cf8409','#ffe0ab','#a86a06'],
  lower:['#2dd4a7','#79ead0','#17a682','#b6f5e5','#0d7a5f'],
  cardio:['#ff6b81','#ffa3b1','#dd4a60','#ffd0d8','#b33247']
};
function shade(g,i){ var a=SHADES[g]||SHADES.upper; return a[i%a.length]; }
function trendBadge(t,n){
  if(n<2) return '<span class="tag t-rest">not enough sessions yet</span>';
  if(t.dir==='up')   return '<span class="tag t-lower">&#8593; building, +'+t.pct+'%</span>';
  if(t.dir==='down') return '<span class="tag t-cardio">&#8595; easing off, '+t.pct+'%</span>';
  return '<span class="tag t-rest">&#8594; holding steady</span>';
}

/* --- donut --- */

  segs.forEach(function(g){
    if(!g.v) return;
    var a2=ang+(g.v/total)*Math.PI*2, big=(a2-ang)>Math.PI?1:0;
    var x1=cx+R*Math.cos(ang), y1=cy+R*Math.sin(ang), x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
    var x3=cx+r*Math.cos(a2), y3=cy+r*Math.sin(a2), x4=cx+r*Math.cos(ang), y4=cy+r*Math.sin(ang);
    s+='<path d="M'+x1+' '+y1+' A'+R+' '+R+' 0 '+big+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+r+' '+r+' 0 '+big+' 0 '+x4+' '+y4+' Z" fill="'+g.c+'"><title>'+g.k+': '+g.v+'</title></path>';

  });

  return s+'</svg>';
}

  h += '<div><div class="sechd"><h2>Effort mix</h2><div class="line"></div></div><div class="card chartbox" style="text-align:center">'
     + donut([{k:'Mild',v:A.intensity.mild,c:'#5a6875'},{k:'Moderate',v:A.intensity.moderate,c:'var(--upper)'},{k:'Intensive',v:A.intensity.intensive,c:'var(--cardio)'}], A.logged, 'you logged')
     + '<div class="legend" style="justify-content:center"><span><span class="dot" style="background:#5a6875;display:inline-block;margin-right:5px"></span>Mild '+A.intensity.mild+'</span>'
     + '<span><span class="dot bg-upper" style="display:inline-block;margin-right:5px"></span>Moderate '+A.intensity.moderate+'</span>'
     + '<span><span class="dot bg-cardio" style="display:inline-block;margin-right:5px"></span>Intensive '+A.intensity.intensive+'</span></div></div></div>';
  h += '</div>';

  h += '<div class="sechd"><h2>Total volume by exercise</h2><div class="line"></div></div>';
  h += '<div class="card chartbox">'+chartVolume(A)+'</div>';

  h += '<div class="sechd"><h2>Activity map</h2><span class="tiny">last 17 weeks</span><div class="line"></div></div>';
  h += '<div class="card chartbox">'+chartHeat()
     + '<div class="legend"><span>Solid = recorded</span><span>Faded = assumed</span><span>Very faint = still planned</span><span style="color:var(--bad)">Red = skipped</span></div></div>';

  h += '<div class="sechd"><h2>Best single sessions</h2><div class="line"></div></div>';
  var bests=Object.keys(A.best).filter(function(id){return A.best[id]>0;})
      .sort(function(a,b){return (A.count[b]||0)-(A.count[a]||0);}).slice(0,10);
  h += '<div class="card pad0">';
  if(!bests.length) h += '<div class="empty">Log a few sessions and your records will appear here.</div>';
  bests.forEach(function(id){
    var ex=LIBMAP[id], u=ex.unit==='sec'?'s hold':(ex.unit==='min'?' min':' reps');
    h += '<div class="row" style="padding:11px 14px;border-bottom:1px solid var(--line)">'
      +  '<span class="dot bg-'+ex.cat+'"></span><b style="font-size:13.5px">'+H(ex.name)+'</b>'
      +  '<span class="tiny" style="margin-left:auto">'+(A.count[id]||0)+' sessions &middot; best <b style="color:var(--tx)">'+A.best[id]+u+'</b></span></div>';
  });
  h += '</div>';

  h += '<div class="card"><b style="font-size:13.5px">Reading these numbers</b><div class="tiny" style="margin-top:6px;line-height:1.6">'
     + 'Totals include days you did not explicitly record, because the app assumes you followed the plan. '
     + 'Anything you mark as <b>Did not exercise</b> is excluded and pulls down the "days not skipped" figure. '
     + 'Since '+(A.firstDate?fmtLong(A.firstDate):'today')+' you have covered '+A.days+' days: '
     + A.sessions+' training, '+A.rest+' rest, '+A.skipped+' skipped'+(totalMin?', plus '+totalMin+' minutes of timed holds and cardio':'')+'.</div></div>';

  document.getElementById('p-stats').innerHTML=h;
}

/* ============================================================
   13. BOOT
   ============================================================ */
load();
refresh();
repairShort();
stampSaved();
if(!STORAGE_OK){
  var _w = document.getElementById('storagewarn');
  if(_w) _w.innerHTML =
    '<div style="margin:14px 0 0;padding:12px 14px;border-radius:11px;background:rgba(255,107,129,.12);'
  + 'border:1px solid rgba(255,107,129,.4);color:#ffb3bd;font-size:13px;line-height:1.55">'
  + '<b>Nothing you log here will be kept.</b> This browser is blocking local storage \u2014 usually because '
  + 'the app is running inside a preview frame or a private window. Save this file to your computer and open '
  + 'it directly, and it will remember everything from then on.</div>';
}
